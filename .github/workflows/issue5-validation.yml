name: Issue 5 Ticket CREATE Validation

on:
  push:
    branches:
      - issue/5-ticket-create-idempotence

permissions:
  contents: read

jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: Lint Ticketing v2 runtime
        run: php -l includes/integrations/ticketing-phase-b.php
      - name: Lint meta registry
        run: php -l includes/core/registry/meta-keys.php
      - name: Lint regression test
        run: php -l tests/ticketing-v2-create-idempotence.php
      - name: Run Ticketing v2 CREATE idempotence regression
        run: php tests/ticketing-v2-create-idempotence.php
